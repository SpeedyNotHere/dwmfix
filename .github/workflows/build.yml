name: Build DWMBlurGlass

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout DWMBlurGlass
        uses: actions/checkout@v4

      - name: Checkout MiaoUI Lite
        uses: actions/checkout@v4
        with:
          repository: Maplespe/MiaoUILite
          ref: 2.0.8
          path: external/MiaoUILite
          persist-credentials: false

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Build MiaoUI Lite
        shell: pwsh
        run: |
          msbuild external/MiaoUILite/MiaoUI/MiaoUI.vcxproj /m /p:Configuration=Release /p:Platform=x64 "/p:SolutionDir=$((Resolve-Path 'external/MiaoUILite').Path)\"

      - name: Restore NuGet packages
        run: nuget restore DWMBlurGlass.sln -NonInteractive -PackagesDirectory packages

      - name: Build DWMBlurGlass
        shell: pwsh
        run: |
          $env:MUI_LITE_LIBRARY = Join-Path $env:GITHUB_WORKSPACE 'external/MiaoUILite/MiaoUI'
          if (!(Test-Path (Join-Path $env:MUI_LITE_LIBRARY 'src/include/Mui.h'))) {
            throw 'MiaoUI Lite headers were not found.'
          }
          if (!(Test-Path (Join-Path $env:MUI_LITE_LIBRARY 'library/MiaoUILite64.lib'))) {
            throw 'MiaoUI Lite x64 library was not built.'
          }
          msbuild DWMBlurGlass.sln /m /p:Configuration=Release /p:Platform=x64 "/p:MUI_LITE_LIBRARY=$env:MUI_LITE_LIBRARY"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dwmfix-release-x64
          path: Build/x64/Release/
          if-no-files-found: error
